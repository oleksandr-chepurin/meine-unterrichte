  <title>Meine Unterrichte</title>
  <style>
    :root{

    .btn:hover{border-color:#bac6d8}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
    .btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;min-height:30px;font-size:13px;border-radius:10px}

    textarea{min-height:84px;resize:vertical}.label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}

    .classroom-shell.bottom-collapsed .bottom-tools{display:none!important}
    .classroom-shell.top-collapsed .drawer,.classroom-shell.top-collapsed .floating-list{top:14px}
    .classroom-shell.top-collapsed .cancelled-strip{top:12px!important}

    .float-tool-dot.select-dot{font-size:17px}

    .mini-tool.material-ok{background:#fff;border-color:var(--line);color:#475569}
    .material-chip-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

    .material-chip.active{background:#fff7ed;border-color:#fb923c;color:#9a3412}
    .material-mini-list{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}

    .calendar-modal{width:min(860px,96vw)}.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.cal-title{font-size:20px;font-weight:850;letter-spacing:-.03em}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(78px,1fr));gap:7px}.cal-weekday{font-size:12px;font-weight:800;color:#64748b;text-align:center;text-transform:uppercase}.cal-day{min-height:78px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:5px}.cal-day:hover{border-color:#93c5fd;background:#eff6ff}.cal-day.empty{opacity:.35;cursor:default;background:transparent;border-color:transparent}.cal-day.has-plan{border-color:#93c5fd;background:#eff6ff}.cal-day.has-canceled{border-color:#fecaca;background:#fef2f2}.cal-day.has-extra{border-color:#fde68a;background:#fffbeb}.cal-day.selected{outline:3px solid rgba(37,99,235,.28);border-color:#2563eb}.cal-day.today .cal-num{background:#111827;color:#fff}.cal-num{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:800}.cal-tags{display:flex;gap:3px;flex-wrap:wrap}.cal-tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 5px;background:#fff;color:#475569}.cal-tag.plan{background:#ecfdf5;border-color:#bbf7d0;color:#15803d}.cal-tag.cancel{background:#fee2e2;border-color:#fecaca;color:#b91c1c}.cal-tag.extra{background:#fffbeb;border-color:#fde68a;color:#b45309}.cal-day .tiny{line-height:1.15}
    .room-editor{display:grid;grid-template-columns:1fr 320px;gap:14px}.room-editor.wide{grid-template-columns:1fr}.room-editor.wide .editor-prop{order:-1;max-height:none;overflow:visible}.settings-layout.room-wide{grid-template-columns:1fr}.settings-layout.room-wide .side-nav{display:none}.editor-canvas-wrap{overflow:auto;touch-action:auto;border:1px solid var(--line);border-radius:18px;background:#e8eef7;padding:14px;min-height:360px;max-height:calc(100vh - 260px)}.room-editor.wide .editor-canvas-wrap{max-height:calc(100vh - 260px);min-height:520px}.editor-canvas{position:relative;background:#fff;border:2px solid #cbd5e1;border-radius:22px}.editor-prop{max-height:70vh;overflow:auto}.editor-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;grid-column:1/-1}.dragging{opacity:.86;z-index:20}.tiny{font-size:12px;color:#64748b}.hr{height:1px;background:var(--line);margin:12px 0}.notice{border:1px dashed #bfdbfe;background:#eff6ff;border-radius:14px;padding:10px;color:#1e3a8a}.danger-zone{border:1px solid #fecaca;background:#fff1f2;border-radius:14px;padding:12px}.print-only{display:none}

    /* iPad Raumeditor v1.0.ab */
    .settings-layout.room-wide{display:block}.settings-layout.room-wide .side-nav{display:none!important}.settings-layout.room-wide>.card.section{padding:10px;border-radius:0;border:0;box-shadow:none;background:transparent}

  function classroomFitScale(room){
    room = room || {};
    var rw = Math.max(1, Number(room.width || 980));
    var rh = Math.max(1, Number(room.height || 620));
    var m = classroomPanelMetrics();
    var scrollEl = document.querySelector('.room-scroll');
    var aw, ah;
    if(scrollEl && scrollEl.clientWidth && scrollEl.clientHeight){
      var cs = getComputedStyle(scrollEl);
      aw = scrollEl.clientWidth - (parseFloat(cs.paddingLeft)||0) - (parseFloat(cs.paddingRight)||0);
      ah = scrollEl.clientHeight - (parseFloat(cs.paddingTop)||0) - (parseFloat(cs.paddingBottom)||0);
    } else {
      aw = (window.innerWidth || document.documentElement.clientWidth || 1200) - 36;
      ah = visibleViewportHeight() - m.topbar - m.topInside - m.bottomInside - 24;
    }
    // v.1.1.az: 100 % = vollständig sichtbar einpassen.
    // Wichtig: nicht cover/max nehmen, sonst wird bei anderem Seitenverhältnis
    // ein Teil unten oder seitlich abgeschnitten. Der Raum darf die sichtbare
    // Klassenraumfläche nicht überschreiten; freie Restfläche ist besser als
    // abgeschnittene Tische/Objekte.

  function screenEdgeVelocity(x,y){

    var vw=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||0;

    var vx=0, vy=0;
    if(x<edge) vx=-(edge-x)/edge*max; else if(x>vw-edge) vx=(x-(vw-edge))/edge*max;

  }
  function enableClassDeskDrag(el,c,room,d){

    function maxX(){ return Math.max(0,(Number(room.width)||980)-(Number(d.w)||el.offsetWidth||80)); }
    function maxY(){ return Math.max(0,(Number(room.height)||620)-(Number(d.h)||el.offsetHeight||60)); }
    function updateDeskPos(){
      if(!drag) return;
      if(scroll){ scroll.scrollLeft=startSL; scroll.scrollTop=startST; }
      var nx=clamp(ox+(lastX-sx)/scale,0,maxX());
      var ny=clamp(oy+(lastY-sy)/scale,0,maxY());

      window.removeEventListener('touchmove',stopNativeScroll,{capture:true});
      window.removeEventListener('pointermove',stopNativeScroll,{capture:true});
      if(moved){
        updateDeskPos();
        var nx=parseFloat(el.style.left)||0, ny=parseFloat(el.style.top)||0;
        var lay=classDeskLayout(c,room.id);
        lay[d.id]={x:Math.round(nx),y:Math.round(ny),w:d.w,h:d.h};
        el.__dragged=true; save();
        setTimeout(function(){ el.__dragged=false; },0);
      }
    }
    el.addEventListener('pointerdown',function(e){
      if(ui.mode!=='sitzordnung') return;
      drag=true; moved=false; sx=e.clientX; sy=e.clientY; lastX=sx; lastY=sy;
      scale=seatingDragScale(el); scroll=el.closest('.room-scroll'); startSL=scroll?scroll.scrollLeft:0; startST=scroll?scroll.scrollTop:0;
      if(scroll) scroll.classList.add('seating-drag-lock');

      try{ el.setPointerCapture(e.pointerId); }catch(_e){}
      el.classList.add('dragging');
      el.style.touchAction='none';
      e.preventDefault(); e.stopPropagation();
      window.addEventListener('touchmove',stopNativeScroll,{passive:false,capture:true});
      window.addEventListener('pointermove',stopNativeScroll,{passive:false,capture:true});
      /* Auto-Scroll beim Tischziehen deaktiviert. */
    },{passive:false});
    el.addEventListener('pointermove',function(e){

  function enableObjDrag(el,obj,onDone){
    var sx,sy,ox,oy,drag=false,moved=false, prevTouchAction='', prevUserSelect='', prevOverscroll='';
    function stopPageScroll(e){ if(drag && e.cancelable) e.preventDefault(); }
    function startDrag(e){
      if(e.button!=null && e.button!==0) return;
      drag=true; moved=false; el._dragMoved=false;
      try{ el.setPointerCapture(e.pointerId); }catch(_e){}
      sx=e.clientX; sy=e.clientY; ox=Number(obj.x)||0; oy=Number(obj.y)||0;
      prevTouchAction=el.style.touchAction; prevUserSelect=document.body.style.userSelect; prevOverscroll=document.body.style.overscrollBehavior;
      el.style.touchAction='none'; document.body.style.userSelect='none'; document.body.style.overscrollBehavior='none';
      el.classList.add('dragging');
      window.addEventListener('touchmove', stopPageScroll, {passive:false,capture:true});
      window.addEventListener('pointermove', stopPageScroll, {passive:false,capture:true});
      if(e.cancelable) e.preventDefault();
    }
    function moveDrag(e){
      if(!drag)return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
      obj.x=Math.round(ox+dx); obj.y=Math.round(oy+dy);

    }
    function endDrag(e){
      if(!drag)return;
      drag=false; el.classList.remove('dragging'); el._dragMoved=moved;
      el.style.touchAction=prevTouchAction; document.body.style.userSelect=prevUserSelect; document.body.style.overscrollBehavior=prevOverscroll;
      window.removeEventListener('touchmove', stopPageScroll, {capture:true});
      window.removeEventListener('pointermove', stopPageScroll, {capture:true});
      if(onDone)onDone(); setTimeout(function(){el._dragMoved=false;},0);
      if(e && e.cancelable) e.preventDefault();
    }
    el.addEventListener('pointerdown',startDrag,{passive:false});
    el.addEventListener('pointermove',moveDrag,{passive:false});
    el.addEventListener('pointerup',endDrag,{passive:false});
    el.addEventListener('pointercancel',endDrag,{passive:false});
    el.addEventListener('touchmove',stopPageScroll,{passive:false});
  }

  function reportAreaBadge(c,sid,area){

      var all={A:0,B:0,C:0,D:0,E:0,total:0,last:'—'};

  function printDoc(title,html){
    var w=window.open('','_blank');
    if(!w){alert('Bitte Popups erlauben.');return;}
    var css='body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#111827;margin:18mm}h1{font-size:20px;margin:0 0 8px}.muted{color:#64748b}.person-block{break-inside:avoid;page-break-inside:avoid;border:1px solid #ddd;border-radius:8px;padding:10px;margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:5px 7px;text-align:left}.print-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}@page{margin:14mm}';
    w.document.open();
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'</style></head><body>'+html+'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},100)}<\/scr'+'ipt></body></html>');
    w.document.close();
  }
  function areaStatsHtml(c,sid,area,label){
    var st=areaStatsForStudent(c,sid,area,{}), vals=gradeValuesFor(c,sid,area); var html='<h3>'+esc(label)+'</h3>';
    if(!(st.avg||st.active||st.na||vals.length)){ return html+'<p class="muted">Keine eingetragenen Daten.</p>'; }
    html+='<table><tr><th>Kennwert</th><th>Wert</th></tr>';
    html+='<tr><td>Durchschnitt Beobachtungen</td><td>'+(st.avg?esc(round1(st.avg)+'★'):'—')+'</td></tr>';
    html+='<tr><td>Aktive Beiträge</td><td>'+esc(st.active||0)+'</td></tr>';
    html+='<tr><td>n/a</td><td>'+esc(st.na||0)+'</td></tr>';
    if(vals.length){ var sum=0; vals.forEach(function(v){sum+=v;}); html+='<tr><td>Manuelle/Schriftliche Noten</td><td>'+esc(vals.length+' Einträge · Ø '+round1(sum/vals.length))+'</td></tr>'; }
    html+='</table>';
    var tools=state.tools.filter(function(t){return t.area===area;}); var rows='';
    tools.forEach(function(t){ var ts=toolStatsForStudent(c,sid,t.id,{}); if(!(ts.count||ts.right||ts.partial||ts.wrong||ts.na)) return; var val=t.kind==='answer' ? ('✅ '+(ts.right||0)+' · 🟡 '+(ts.partial||0)+' · ❌ '+(ts.wrong||0)+' · n/a '+(ts.na||0)) : (t.kind==='conduct' ? (conductSummaryText(ts.conduct)+' · Vorschlag '+conductProposalFromCounts(ts.conduct)) : ((ts.count?round1(ts.avg)+'★ · '+ts.count+' Einträge':'—')+' · n/a '+(ts.na||0))); rows+='<tr><td>'+esc(t.icon+' '+t.name)+'</td><td>'+esc(val)+'</td></tr>'; });
    if(rows) html+='<table style="margin-top:6px"><tr><th>Werkzeug/Kriterium</th><th>Schuljahr</th></tr>'+rows+'</table>';
    return html;
  }

  function cardStatsHtml(c,sid){
    var rows=''; (state.lessons||[]).filter(function(l){return l.classId===c.id;}).forEach(function(l){ (l.cards||[]).forEach(function(e){ if(e.studentId!==sid) return; var b=(l.blocks||[]).find(function(x){return x.id===e.blockId;}); rows+='<tr><td>'+esc(l.date)+'</td><td>'+esc(cardEventTime(e))+'</td><td>'+esc(cardEventLabel(e))+'</td><td>'+esc(b?(b.title||blockMeta(b.type)[1]):'')+'</td><td>'+esc(e.type==='red'?((e.place||'')+' '+(e.task||'')+' '+(e.supervision||'')):'')+'</td></tr>'; }); });
    if(!rows) return '<h3>Karten / Verwarnungen</h3><p class="muted">Keine Karten dokumentiert.</p>';
    return '<h3>Karten / Verwarnungen</h3><table><tr><th>Datum</th><th>Uhrzeit</th><th>Art</th><th>Etappe</th><th>Hinweis</th></tr>'+rows+'</table>';
  }

  function printStudentStatistics(c){
    if(!c)return; var html='<div class="print-header"><h1>Schülerstatistik · '+esc(c.subject+' '+c.name)+'</h1><div class="muted">'+esc(todayISO())+'</div></div><p class="muted">Es werden nur eingetragene Daten ausgewertet. n/a = nicht aktiv / keine aktive Beteiligung.</p>';

      html+='<table><tr><th>Bereich</th><th>Überblick</th></tr>';
      html+='<tr><td>MN</td><td>'+esc(reportAreaBadge(c,s.id,'MN'))+' · Vorschlag: '+esc(sum.mnProposal)+'</td></tr>';
      html+='<tr><td>AV</td><td>'+esc(reportAreaBadge(c,s.id,'AV'))+'</td></tr>';
      html+='<tr><td>SV</td><td>'+esc(reportAreaBadge(c,s.id,'SV'))+'</td></tr>';
      html+='<tr><td>SN</td><td>'+esc(reportAreaBadge(c,s.id,'SN'))+' · Vorschlag: '+esc(sum.snProposal)+'</td></tr>';

      html+=areaStatsHtml(c,s.id,'MN','Mitarbeit / MN'); html+=areaStatsHtml(c,s.id,'AV','Arbeitsverhalten / AV'); html+=areaStatsHtml(c,s.id,'SV','Sozialverhalten / SV'); html+=areaStatsHtml(c,s.id,'SN','Schriftliche Leistung / SN'); html+=cardStatsHtml(c,s.id);
      if(s.remarks) html+='<p><b>Schülerprofil:</b> '+esc(s.remarks)+'</p>'; html+='<p class="muted">Bemerkung / Entscheidung der Lehrkraft: ________________________________</p></section>'; });
    printDoc('Schülerstatistik '+c.name,html);
  }
  function printInterimReports(c){ if(!c)return; var html='<div class="print-header"><h1>Zwischenstände · '+esc(c.subject+' '+c.name)+'</h1><div class="muted">'+esc(todayISO())+'</div></div>'; c.students.forEach(function(s){ var fake={id:'fake',date:todayISO()}; var sum=studentSummary(c,s.id,fake); html+='<section class="person-block"><h2>'+esc(s.name)+'</h2><table><tr><th>Bereich</th><th>Stand</th></tr><tr><td>MN-Vorschlag</td><td>'+esc(sum.mnProposal)+'</td></tr><tr><td>SN-Vorschlag</td><td>'+esc(sum.snProposal)+'</td></tr><tr><td>AV</td><td>'+esc(reportAreaBadge(c,s.id,'AV'))+'</td></tr><tr><td>SV</td><td>'+esc(reportAreaBadge(c,s.id,'SV'))+'</td></tr></table><p class="muted">Bemerkung / Entscheidung der Lehrkraft: ________________________________</p></section>'; }); printDoc('Zwischenstände '+c.name,html); }
  function printClassOverview(c){ if(!c)return; var html='<div class="print-header"><h1>Klassenübersicht · '+esc(c.subject+' '+c.name)+'</h1><div class="muted">'+esc(todayISO())+'</div></div><table><thead><tr><th>Name</th><th>MN Vorschlag</th><th>SN Vorschlag</th><th>AV</th><th>SV</th><th>Zeugnis / Entscheidung</th></tr></thead><tbody>'; c.students.forEach(function(s){ var sum=studentSummary(c,s.id,{id:'fake',date:todayISO()}); html+='<tr><td>'+esc(s.name)+'</td><td>'+esc(sum.mnProposal)+'</td><td>'+esc(sum.snProposal)+'</td><td>'+esc(reportAreaBadge(c,s.id,'AV'))+'</td><td>'+esc(reportAreaBadge(c,s.id,'SV'))+'</td><td></td></tr>'; }); html+='</tbody></table>'; printDoc('Klassenübersicht '+c.name,html); }
  function printStudentList(c){ if(!c)return; var html='<div class="print-header"><h1>Schülerliste · '+esc(c.subject+' '+c.name)+'</h1><div class="muted">'+esc(todayISO())+'</div></div><table><thead><tr><th>Nr.</th><th>Name</th><th>Bemerkung</th></tr></thead><tbody>'; c.students.forEach(function(s,i){html+='<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.remarks||'')+'</td></tr>';}); html+='</tbody></table>'; printDoc('Schülerliste '+c.name,html); }
  function printTestReports(c,lesson,block){ var html='<div class="print-header"><h1>'+esc((block.test&&block.test.title)||'Test')+' · '+esc(c.subject+' '+c.name)+'</h1><div class="muted">'+esc(lesson.date)+'</div></div>'; c.students.forEach(function(s){ var t=testTotals(block,s.id); html+='<section class="person-block"><h2>'+esc(s.name)+'</h2><table><thead><tr><th>Teil</th><th>Punkte</th></tr></thead><tbody>'; block.test.parts.forEach(function(p){ var val=(block.test.points[s.id]&&block.test.points[s.id][p.id])||0; html+='<tr><td>'+esc(p.label)+'</td><td>'+esc(val)+' / '+esc(p.max)+'</td></tr>'; }); html+='<tr><th>Gesamt</th><th>'+t.earned+' / '+t.max+' · '+round1(t.percent)+'% · '+esc(block.area||'SN')+' · Note '+esc(gradeFromPercent(t.percent,scaleForTest(block)))+'</th></tr></tbody></table><p>Unterschrift: __________________</p></section>'; }); printDoc('Testberichte '+c.name,html); }

  function nextExportFileName(){
    var d=new Date();
    return 'MU '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+'-'+String(d.getMinutes()).padStart(2,'0')+'.json';
  }
  function exportJSON(){
    var name=nextExportFileName();
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob); var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
    return name;
  }
  function logoutMU(){
    if(muLoggedOut)return;
    var filename=exportJSON();
    // Ein Download-Start bestätigt NICHT, dass die Datei auf IServ gespeichert wurde.
    var ok=confirm('Die Sicherung "'+filename+'" wurde zum Speichern angeboten.\n\nBitte die Datei zuerst in IServ ablegen und dort überprüfen.\n\nNur wenn die Datei auf IServ sicher vorhanden ist, mit OK bestätigen.\n\nOK = lokale Arbeitsdaten löschen; Abbrechen = Daten behalten.');
    if(!ok){showToast('Abmelden abgebrochen. Daten bleiben erhalten.');return;}
    try{
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('meine-unterrichte-export-counters-v1');
      sessionStorage.removeItem(STORAGE_KEY);
    }catch(e){alert('Browserdaten konnten nicht vollständig gelöscht werden. Bitte Browserdaten manuell prüfen.');return;}
    muLoggedOut=true;
    state=seedData();
    document.body.innerHTML='';
    var screen=document.createElement('div');
    screen.style.cssText='min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui;padding:24px;text-align:center;background:#f5f7fb;color:#17233b';
    var title=document.createElement('h1');title.textContent='Meine Unterrichte';screen.appendChild(title);
    var info=document.createElement('p');info.textContent='Abgemeldet. Die lokalen Arbeitsdaten wurden entfernt. Zum Fortsetzen bitte die JSON-Sicherung aus IServ öffnen.';screen.appendChild(info);
    var btn=document.createElement('button');btn.textContent='JSON öffnen';btn.style.cssText='padding:12px 24px;border-radius:12px;border:0;background:#315bea;color:white;font-size:17px';
    var input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.style.display='none';
    btn.onclick=function(){input.click();};
    input.onchange=function(){var f=input.files&&input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(String(r.result));if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Ungültig');localStorage.setItem(STORAGE_KEY,JSON.stringify(data));location.reload();}catch(e){alert('JSON-Datei konnte nicht geladen werden.');}};r.readAsText(f);};
    screen.appendChild(btn);screen.appendChild(input);document.body.appendChild(screen);
  }
  function importJSON(e){ var file=e.target.files&&e.target.files[0]; if(!file)return; var reader=new FileReader(); reader.onload=function(){ try{ state=migrate(JSON.parse(String(reader.result))); save(); ui.view='dashboard'; hardResetNormalScroll(); render(); showToast('Datei geladen.'); }catch(err){ alert('Datei konnte nicht geöffnet werden.'); } }; reader.readAsText(file); e.target.value=''; }

  var classroomViewportFitTimer=null;
  function classroomViewportChanged(){
    if(ui && ui.view==='classroom'){
      updateViewportVars();
      window.scrollTo(0,0);
      if(ui.classroomFit){
        if(classroomViewportFitTimer) clearTimeout(classroomViewportFitTimer);
        classroomViewportFitTimer=setTimeout(function(){ classroomViewportFitTimer=null; if(ui && ui.view==='classroom' && ui.classroomFit){ scheduleClassroomFitPass(); renderKeepScroll(); } },90);
      }
    }
  }
  window.addEventListener('resize', function(){ classroomViewportChanged(); stabilizeViewportAfterWake(); }, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(classroomViewportChanged,80); setTimeout(classroomViewportChanged,320); stabilizeViewportAfterWake(); }, {passive:true});
  window.addEventListener('focus', stabilizeViewportAfterWake, {passive:true});
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) stabilizeViewportAfterWake(); }, {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ classroomViewportChanged(); stabilizeViewportAfterWake(); }, {passive:true});
    window.visualViewport.addEventListener('scroll', classroomViewportChanged, {passive:true});
  }
  document.addEventListener('touchmove', function(e){
    if(!document.body.classList.contains('classroom-active')) return;
    var t=e.target;
    if(t && t.closest && (t.closest('.room-scroll') || t.closest('.class-head') || t.closest('.phase-strip') || t.closest('.instrument-strip') || t.closest('.group-prep-panel') || t.closest('.drawer') || t.closest('.modal'))) return;
    e.preventDefault();
  }, {passive:false, capture:true});

  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
  window.addEventListener('load', function(){ stabilizeViewportAfterWake(); }, {passive:true});
  window.addEventListener('pageshow', function(){ stabilizeViewportAfterWake(); }, {passive:true});
  state=load(); save();
  // Vor dem ersten Rendern bereits die aktuell sichtbare Browserhöhe setzen.
  // Das verhindert den falschen ersten Layout-Zustand auf iPad/Chrome.
  updateViewportVars();
  stabilizeViewportAfterWake();
  render();
})();
